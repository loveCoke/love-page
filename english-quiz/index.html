<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英语专升本刷题</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">刷</span>
        <div>
          <h1>英语专升本刷题</h1>
          <p id="statsLine">已答 0/200 · 正确率 --</p>
        </div>
      </div>
      <div class="badges">
        <span class="badge" id="wrongBadge">错题 0</span>
        <span class="badge badge-blue" id="modeBadge">顺序刷题</span>
      </div>
    </header>

    <section class="toolbar" aria-label="刷题控制">
      <div class="segmented" id="quizFilter">
        <button type="button" data-filter="all" class="active">全部</button>
        <button type="button" data-filter="1">1</button>
        <button type="button" data-filter="2">2</button>
        <button type="button" data-filter="3">3</button>
        <button type="button" data-filter="4">4</button>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-ghost" id="sequenceBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
          顺序刷题
        </button>
        <button type="button" class="btn btn-ghost" id="randomBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
          随机刷题
        </button>
        <button type="button" class="btn btn-warn" id="wrongBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          错题本
        </button>
        <button type="button" class="btn btn-warn" id="wrongRandomBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
          错题重刷
        </button>
        <button type="button" class="btn btn-danger" id="clearWrongBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          清空错题
        </button>
      </div>
    </section>

    <main class="stage" id="stage" aria-live="polite">
      <div class="question-panel">
        <div class="question-head">
          <span id="questionTag">测验1 · 第 1 题</span>
          <span id="progressText">1 / 50</span>
        </div>
        <h2 id="questionStem"></h2>
        <div class="options" id="options"></div>
        <div class="result hidden" id="result">
          <div class="result-verdict" id="verdict"></div>
          <div class="result-block">
            <span class="label">正确答案</span>
            <p id="correctAnswer"></p>
          </div>
          <div class="result-block">
            <span class="label">解析</span>
            <p id="explanation"></p>
          </div>
          <div class="result-block">
            <span class="label">翻译</span>
            <p id="translation"></p>
          </div>
          <div class="result-actions">
            <button type="button" class="btn" id="wrongToggleBtn"></button>
            <button type="button" class="btn btn-ghost" id="masterToggleBtn"></button>
          </div>
        </div>
      </div>
      <div class="nav-bar">
        <button type="button" class="btn btn-ghost" id="prevBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
          上一题
        </button>
        <span id="navHint"></span>
        <button type="button" class="btn btn-primary" id="nextBtn">
          下一题
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div id="overlay" class="hidden"></div>
    </main>

    <section class="summary" id="summary">
      <div class="summary-item">
        <span class="summary-value" id="sumAnswered">0</span>
        <span class="summary-label">已答</span>
      </div>
      <div class="summary-item">
        <span class="summary-value" id="sumCorrect">0</span>
        <span class="summary-label">答对</span>
      </div>
      <div class="summary-item">
        <span class="summary-value" id="sumRate">--</span>
        <span class="summary-label">正确率</span>
      </div>
      <div class="summary-item">
        <span class="summary-value" id="sumWrong">0</span>
        <span class="summary-label">错题</span>
      </div>
    </section>
  </div>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
